name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      
      - name: PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      
      - name: Install Composer dependencies
        run: |
          composer require --dev wp-coding-standards/wpcs:"^3.0"
          composer require --dev squizlabs/php_codesniffer:"^3.7"
          composer require --dev phpcompatibility/phpcompatibility-wp:"^2.1"
          vendor/bin/phpcs --config-set installed_paths vendor/wp-coding-standards/wpcs,vendor/phpcompatibility/phpcompatibility-wp
      
      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=WordPress --extensions=php --ignore=vendor/,tests/ .

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1']
        wordpress: ['6.5', 'latest']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      
      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql version: '5.7'
          mysql database: 'wordpress_test'
          mysql root password: 'root'
      
      - name: Install WordPress Test Suite
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      
      - name: Run PHPUnit
        run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      
      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      
      - name: Setup WordPress
        run: |
          wp core download --path=/tmp/wordpress --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --path=/tmp/wordpress --allow-root
      
      - name: Install Plugin Check
        run: |
          wp plugin install plugin-check --activate --path=/tmp/wordpress --allow-root
      
      - name: Copy plugin to WordPress
        run: |
          mkdir -p /tmp/wordpress/wp-content/plugins/oli-conditional-shipping-payments
          cp -r * /tmp/wordpress/wp-content/plugins/oli-conditional-shipping-payments/
      
      - name: Run Plugin Check
        run: |
          wp plugin-check run oli-conditional-shipping-payments --path=/tmp/wordpress --allow-root
